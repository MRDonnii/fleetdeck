# Fleetdeck netværksboot: proxy-DHCP + TFTP. Routerens DHCP bliver ved med at uddele IP-adresser.
# Svarer KUN UEFI x64-pc'er (arch 7 og 9) – Raspberry Pi'er og andet ignoreres.
port=0
interface=@IFACE@
bind-interfaces
dhcp-range=@SUBNET@,proxy,@NETMASK@
log-dhcp
# Svar kun pc'er med UEFI (Windows/Ubuntu) og de Raspberry Pi'er, der har slået netboot til i Fleetdeck (PXE/pi/hosts)
dhcp-ignore=tag:!efi64,tag:!rpi
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
# Fleetdeck skriver en fil pr. pc med en Ubuntu-udrulning ("<mac>,set:ubuntu"). start.sh sender SIGHUP hvert halve minut.
dhcp-hostsdir=/winsetup/PXE/deploy/hosts
# Raspberry Pi: én fil pr. Pi ("<mac>,set:rpi"), skrevet af Fleetdeck under maskinens side → Netboot
dhcp-hostsdir=/winsetup/PXE/pi/hosts
pxe-service=tag:rpi,0,"Raspberry Pi Boot"
tag-if=set:winpxe,tag:efi64,tag:!ubuntu
tag-if=set:ubupxe,tag:efi64,tag:ubuntu
# OBS: andre proxy-DHCP-servere på netværket (fx Raspberry Pi-netboot) skal ignorere UEFI x64-pc'er
# (dhcp-match client-arch 7/9 + dhcp-ignore), ellers kan pc'en vælge deres svar og gå i stå.
# Windows: Microsofts signerede boot manager (Secure Boot kan forblive slået til)
pxe-service=tag:winpxe,X86-64_EFI,"WinSetup - Windows",Boot/bootmgfw.efi
pxe-service=tag:winpxe,BC_EFI,"WinSetup - Windows",Boot/bootmgfw.efi
# Ubuntu: shim signeret af Microsoft + GRUB signeret af Canonical
pxe-service=tag:ubupxe,X86-64_EFI,"WinSetup - Ubuntu",ubuntu/bootx64.efi
pxe-service=tag:ubupxe,BC_EFI,"WinSetup - Ubuntu",ubuntu/bootx64.efi
enable-tftp
tftp-root=/winsetup/PXE/tftp
user=root
