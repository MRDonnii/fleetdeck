# Docker-billedet til en Fleetdeck-udgivelse: ghcr.io/<ejer>/fleetdeck:<version>
# Kører, når et versions-tag (v3.16.0, v3.17.0-beta.1 …) skubbes – eller manuelt med et tag.
# Udgiv først GitHub-udgivelsen, når dette job er grønt (se docs/OPDATERING.md).
name: Docker-billede til udgivelse

# Startes i hånden (Actions → Kør workflow med et tag). GHCR-pakken fleetdeck hører endnu til det gamle,
# private repo, så indtil den er koblet til dette repo, bygges og pushes billedet lokalt.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, fx v3.16.0'
        required: true
      menu_from:
        description: 'Genbrug FleetdeckMenu fra et tidligere billede (fx 3.45.0), når menuen er uændret – så Mac''erne ikke bygger menuen om. Tom = byg med swiftc.'
        required: false
        default: ''

permissions:
  contents: write   # GitHub-udgivelsen laves her, når billedet er lagt op
  packages: write

jobs:
  # Den native menulinje på Mac (FleetdeckMenu, Swift/AppKit) kan kun bygges med Apples værktøjer: én binær pr. arkitektur,
  # ad hoc-signeret, med versionsstemplet tjekket. Billedet nedenfor lægger dem i Mac-pakken (Fleetdeck.app/Contents/Resources/menu).
  macmenu:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Byg FleetdeckMenu (Apple Silicon og Intel)
        env:
          OWNER: ${{ github.repository_owner }}
          MENU_FROM: ${{ inputs.menu_from }}
        run: |
          set -euo pipefail
          STAMP=$(sed -n 's/.*public const string Marker = "\(fleetdeck-menu-api=[0-9]*\)".*/\1/p' src/Fleetdeck.Shared/MacApp.cs)
          grep -q "let menuStamp = \"$STAMP\"" src/Fleetdeck.MacMenu/main.swift || { echo "::error::main.swift har ikke $STAMP (MacMenuStamp i MacApp.cs)"; exit 1; }
          for a in arm64:arm64 x64:x86_64; do
            out=src/Fleetdeck.MacMenu/build/${a%%:*}; mkdir -p "$out"
            if [ -n "$MENU_FROM" ]; then
              # Samme bytes som i billedet $MENU_FROM (fra dets Mac-DMG): agenten sammenligner menuens SHA-256 og bygger kun
              # FleetdeckMenu.app om, når den ændres
              dmg=$(.github/scripts/dmg-from-image.sh "ghcr.io/${OWNER,,}/fleetdeck:$MENU_FROM" "Fleetdeck-mac-${a%%:*}.dmg")
              mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
              src=$(find "$mnt" -path '*/Contents/Resources/menu/FleetdeckMenu' | head -1)
              [ -n "$src" ] || { echo "::error::FleetdeckMenu findes ikke i $MENU_FROM ($dmg)"; exit 1; }
              cp "$src" "$out/FleetdeckMenu"; chmod 755 "$out/FleetdeckMenu"
              hdiutil detach "$mnt" >/dev/null
              shasum -a 256 "$out/FleetdeckMenu"
            else
              swiftc -O -target ${a##*:}-apple-macos12 src/Fleetdeck.MacMenu/main.swift -o "$out/FleetdeckMenu"
              codesign --force -s - -i com.fleetdeck.menu "$out/FleetdeckMenu"
            fi
            codesign -v "$out/FleetdeckMenu"
            grep -q "$STAMP" "$out/FleetdeckMenu" || { echo "::error::$out/FleetdeckMenu mangler $STAMP"; exit 1; }
            cp src/Fleetdeck.MacMenu/menu-icon@2x.png "$out/"
            file "$out/FleetdeckMenu"
          done
          [ "$(src/Fleetdeck.MacMenu/build/$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)/FleetdeckMenu --version)" = "$STAMP" ]

      # Agenten bygger menuen om til FleetdeckMenu.app på Mac'en (Info.plist = src/Fleetdeck.MacMenu/Info.plist, holdt lig med
      # MacMenuBundle.InfoPlist() af testene) og signerer den ad hoc. Her tjekkes det samme med Apples egne værktøjer.
      - name: FleetdeckMenu.app som agenten bygger den (Info.plist, ad hoc-signatur)
        run: |
          set -euo pipefail
          plutil -lint src/Fleetdeck.MacMenu/Info.plist
          A=$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64 )
          T=$(mktemp -d)/FleetdeckMenu.app
          mkdir -p "$T/Contents/MacOS" "$T/Contents/Resources"
          cp src/Fleetdeck.MacMenu/Info.plist "$T/Contents/Info.plist"
          cp "src/Fleetdeck.MacMenu/build/$A/FleetdeckMenu" "$T/Contents/MacOS/"
          cp src/Fleetdeck.MacMenu/menu-icon@2x.png "$T/Contents/Resources/"
          codesign --force --sign - --identifier com.fleetdeck.menu "$T"
          codesign --verify --deep --strict --verbose=2 "$T"
          [ "$(defaults read "$T/Contents/Info" CFBundleIdentifier)" = com.fleetdeck.menu ]
          [ "$("$T/Contents/MacOS/FleetdeckMenu" --version)" = "$(sed -n 's/.*public const string Marker = "\(fleetdeck-menu-api=[0-9]*\)".*/\1/p' src/Fleetdeck.Shared/MacApp.cs)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: fleetdeckmenu
          path: src/Fleetdeck.MacMenu/build/
          if-no-files-found: error

  image:
    needs: macmenu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # FleetdeckMenu fra macOS-jobbet (Dockerfile stopper med REQUIRE_MAC_MENU=1, hvis den mangler)
      - uses: actions/download-artifact@v4
        with:
          name: fleetdeckmenu
          path: src/Fleetdeck.MacMenu/build/

      - name: FleetdeckMenu skal være eksekverbar
        run: chmod 755 src/Fleetdeck.MacMenu/build/*/FleetdeckMenu

      - name: Version og tag skal passe sammen
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tagget $TAG passer ikke med <Version>$VERSION</Version> i Directory.Build.props"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/fleetdeck" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "channel=beta" >> "$GITHUB_OUTPUT" ;; *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;; esac

      # arm64 (Raspberry Pi 4/5, ARM-NAS): kun runtime-trinnet kører under QEMU, resten bygges én gang (se Dockerfile)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REQUIRE_MAC_MENU=1
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.channel }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Først nu findes billedet: så må "Opdatér Fleetdeck" se versionen (deploy.sh laver ikke længere udgivelsen selv)
      - name: GitHub-udgivelse (Beta), når billedet er lagt op
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Udgivelsen $TAG findes allerede"; exit 0; fi
          NOTES=$(git log -1 --format=%B HEAD 2>/dev/null | sed '/^Co-Authored-By:/d')
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Fleetdeck $VERSION (Beta)" --notes "${NOTES:-Fleetdeck $VERSION.}"
